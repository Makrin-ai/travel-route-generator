<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация — TravelGen</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #db2777;
            --background: #0f172a;
            --surface: rgba(139, 67, 91, 0.7);
            --text: #f8fafc;
            --text-muted: #fbcfe8;
            --accent: #ec4899;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(125deg, #DB7093, #c25f80, #9c4c66, #c25f80, #DB7093);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .card {
            background: rgba(139, 67, 91, 0.65);
            backdrop-filter: blur(16px);
            padding: 40px;
            border-radius: 20px;
            width: 360px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .card h2 {
            margin-bottom: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #fbcfe8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .input-group {
            margin-bottom: 16px;
        }
        .input-group label {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            box-sizing: border-box;
            outline: none;
            font-family: inherit;
        }
        .input-group input:focus {
            border-color: #f472b6;
            box-shadow: 0 0 0 3px rgba(244, 114, 182, 0.3);
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #f472b6, #db2777);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.25s;
            box-shadow: 0 4px 12px rgba(219, 39, 119, 0.4);
        }
        .btn:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }
        .error {
            color: #ffb3b3;
            font-size: 12px;
            margin-bottom: 16px;
            text-align: center;
            background: rgba(239, 68, 68, 0.2);
            padding: 8px;
            border-radius: 8px;
        }
        .footer-text {
            margin-top: 20px;
            font-size: 13px;
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
        }
        .footer-text a {
            color: #fbcfe8;
            text-decoration: none;
            font-weight: 600;
        }
        .footer-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="card">
        {% if step == 1 %}
            <h2>Имя пользователя ✍️</h2>
            {% if error %}
                <div class="error">{{ error }}</div>
            {% endif %}
            <form action="/register" method="POST">
                <div class="input-group">
                    <label>Введите имя пользователя</label>
                    <input type="text" name="username" required autocomplete="off">
                </div>
                <button type="submit" class="btn">Далее</button>
            </form>
        {% elif step == 2 %}
            <h2>Регистрация (Шаг 2) 🔐</h2>
            {% if error %}
                <div class="error">{{ error }}</div>
            {% endif %}
            <form action="/register" method="POST">
                <input type="hidden" name="username" value="{{ username }}">
                
                <div class="input-group">
                    <label>Электронная почта</label>
                    <input type="email" name="email" required>
                </div>
                <div class="input-group">
                    <label>Пароль</label>
                    <input type="password" name="password" required>
                </div>
                <div class="input-group">
                    <label>Повторите пароль</label>
                    <input type="password" name="confirm_password" required>
                </div>
                <button type="submit" class="btn">Зарегистрироваться</button>
            </form>
        {% endif %}
        
        {% if step == 1 %}
            <div class="footer-text">
                Уже есть аккаунт? <a href="/login">Войти</a>
            </div>
        {% endif %}
    </div>
</body>
</html>
