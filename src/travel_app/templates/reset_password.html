<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Восстановление доступа — TravelGen</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #db2777;
            --background: #0f172a;
            --surface: rgba(139, 67, 91, 0.7);
            --text: #f8fafc;
            --text-muted: #fbcfe8;
            --accent: #ec4899;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(125deg, #DB7093, #c25f80, #9c4c66, #c25f80, #DB7093);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .auth-container {
            background: rgba(139, 67, 91, 0.65);
            backdrop-filter: blur(16px);
            padding: 40px;
            border-radius: 20px;
            width: 380px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }
        h2 {
            margin-bottom: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #fbcfe8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        p {
            margin-bottom: 20px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            box-sizing: border-box;
            outline: none;
            font-family: inherit;
            font-size: 14px;
        }
        input:focus {
            border-color: #f472b6;
            box-shadow: 0 0 0 3px rgba(244, 114, 182, 0.3);
        }
        input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #f472b6, #db2777);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.25s;
            box-shadow: 0 4px 12px rgba(219, 39, 119, 0.4);
            font-family: inherit;
        }
        button:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }
        a {
            color: #fbcfe8;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
        }
        a:hover {
            text-decoration: underline;
            color: #fff;
        }
        .error {
            color: #ffb3b3;
            background: rgba(239, 68, 68, 0.2);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
        }
        .success {
            color: #d1fae5;
            background: rgba(34, 197, 94, 0.2);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
        }
        hr {
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <h2>🔐 Сброс пароля</h2>
        
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        
        {% if success %}
            <div class="success">{{ success }}</div>
            <a href="{{ url_for('login') }}" class="back-link">✨ Перейти к входу ✨</a>
        {% else %}
            <p>Введите Email, указанный при регистрации, и новый пароль:</p>
            <form method="POST">
                <input type="email" name="email" placeholder="Ваш Email" required>
                <input type="password" name="password" placeholder="Новый пароль" required>
                <input type="password" name="confirm_password" placeholder="Повторите пароль" required>
                <button type="submit">Обновить пароль</button>
            </form>
            <hr>
            <a href="{{ url_for('login') }}">← Назад ко входу</a>
        {% endif %}
    </div>
</body>
</html>
