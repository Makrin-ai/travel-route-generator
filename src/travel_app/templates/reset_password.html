<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Восстановление доступа</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="auth-container">
        <h2>Сброс пароля</h2>
        
        {% if error %}
            <p style="color: #e74c3c; background: #fdeaea; padding: 10px; border-radius: 5px;">{{ error }}</p>
        {% endif %}
        
        {% if success %}
            <p style="color: #27ae60; background: #eafaf1; padding: 10px; border-radius: 5px;">{{ success }}</p>
            <p><a href="{{ url_for('login') }}">Перейти к входу</a></p>
        {% else %}
            <form method="POST">
                <p>Введите Email, указанный при регистрации, и новый пароль:</p>
                <input type="email" name="email" placeholder="Ваш Email" required>
                <input type="password" name="password" placeholder="Новый пароль" required>
                <input type="password" name="confirm_password" placeholder="Повторите пароль" required>
                <button type="submit">Обновить пароль</button>
            </form>
            <p><a href="{{ url_for('login') }}">Назад</a></p>
        {% endif %}
    </div>
</body>
</html>
